<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/img/logo_fondo.png" type="image/x-icon" />
    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- FontAwesome (Para iconos de redes sociales) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Toastify CSS -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Home - ProtoShop</title>
  </head>
  <body>
    <!-- HEADER (LOGO Y NAV) -->
    <header class="encabezado">
      <a href="index.html" class="logo-enlace">
        <img
          src="assets/img/logo_fondo.png"
          alt="ProtoShop Logo"
          class="encabezado__logo"
        />
      </a>
      <nav class="navegacion">
        <ul class="navegacion__lista">
          <li class="navegacion__item">
            <a href="index.html" class="navegacion__enlace">
              <span class="material-icons">home</span> Home
            </a>
          </li>
          <li class="navegacion__item">
            <a href="nosotros.html" class="navegacion__enlace">
              <span class="material-icons">group</span> Sobre Nosotros
            </a>
          </li>
          <li class="navegacion__item">
            <a
              href="login.html"
              class="navegacion__enlace"
              id="btn-login-logout"
            >
              <span class="material-icons">login</span> Login
            </a>
          </li>
          <li class="navegacion__item">
            <a href="#" class="navegacion__enlace" id="btn-carrito">
              <span class="material-icons">shopping_cart</span>
              <span id="contador-carrito" class="contador-carrito">0</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="contenedor-principal">
      <!-- SECCIÓN FILTROS -->
      <section class="filtros">
        <!-- Grupo 1: Categoría -->
        <div class="filtros__grupo">
          <label for="filtro-categoria" class="filtros__etiqueta"
            >Categoría</label
          >
          <select id="filtro-categoria" class="filtros__input">
            <option value="">Todas</option>
            <!-- Se llenará dinámicamente -->
          </select>
        </div>

        <!-- Grupo 2: Atributo + Valor -->
        <div class="filtros__grupo">
          <label for="filtro-atributo" class="filtros__etiqueta"
            >Filtrar por</label
          >
          <select id="filtro-atributo" class="filtros__input">
            <option value="price">Precio menor que</option>
            <option value="price-higher">Precio mayor que</option>
            <option value="rate">Rating menor que</option>
            <option value="rate-higher">Rating mayor que</option>
          </select>
        </div>

        <div class="filtros__grupo">
          <label for="filtro-valor" class="filtros__etiqueta">Valor</label>
          <input
            type="number"
            id="filtro-valor"
            class="filtros__input"
            placeholder="Ej: 100"
          />
        </div>

        <!-- Grupo 3: Ordenación -->
        <div class="filtros__grupo">
          <label for="filtro-orden" class="filtros__etiqueta"
            >Ordenar por</label
          >
          <select id="filtro-orden" class="filtros__input">
            <option value="defecto">Defecto</option>
            <option value="precio-asc">Precio: Menor a Mayor</option>
            <option value="precio-desc">Precio: Mayor a Menor</option>
            <option value="nombre-asc">Nombre: A-Z</option>
            <option value="nombre-desc">Nombre: Z-A</option>
          </select>
        </div>

        <button id="btn-limpiar-filtros" class="filtros__boton">Limpiar</button>
      </section>

      <!-- CONTENEDOR DE LOS PRODUCTOS (CARDS) -->
      <section id="contenedor" class="productos-grid"></section>

      <!-- CENTINELA para el Intersection Observer del scroll infinito -->
      <div id="sentinel" style="height: 1px; width: 100%"></div>
    </main>

    <footer class="pie-pagina">
      <div class="pie-pagina__sociales">
        <a href="#" class="social-icon"
          ><i class="fa-brands fa-instagram"></i
        ></a>
        <a href="#" class="social-icon"><i class="fa-brands fa-twitter"></i></a>
        <a href="#" class="social-icon"
          ><i class="fa-brands fa-facebook-f"></i
        ></a>
        <a href="#" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
      </div>
      <p class="pie-pagina__texto">
        &copy; 2025 ProtoShop. Todos los derechos reservados.
      </p>
    </footer>

    <!-- MODAL CARRITO -->
    <dialog id="modal-carrito" class="modal">
      <div class="modal__contenido modal__contenido--carrito">
        <button class="modal__cerrar" id="btn-cerrar-carrito">&times;</button>
        <h2 class="modal__titulo">
          Tu Carrito <span class="material-icons">shopping_cart</span>
        </h2>

        <div id="carrito-body" class="carrito__items">
          <!-- Aquí se inyecta el fragment del carrito -->
        </div>

        <div class="carrito__footer">
          <div class="carrito__total">
            <span>Total:</span>
            <span id="carrito-total-precio">$0.00</span>
          </div>
          <button class="boton-primario" id="btn-finalizar-compra">
            Finalizar Compra
          </button>
        </div>
      </div>
    </dialog>

    <!-- MODAL DETALLES PRODUCTO -->
    <dialog id="modal-producto" class="modal">
      <div class="modal__contenido">
        <button id="btn-cerrar-modal" class="modal__cerrar">&times;</button>
        <div class="modal__grid">
          <div class="modal__imagen-box">
            <img id="modal-img" src="" alt="" class="modal__imagen" />
          </div>
          <div class="modal__info">
            <h2 id="modal-titulo" class="modal__titulo"></h2>
            <div class="modal__meta">
              <span id="modal-categoria" class="modal__tag"></span>
              <span
                id="modal-marca"
                class="modal__tag modal__tag--marca"
              ></span>
            </div>
            <div class="modal__precio-container">
              <p id="modal-precio" class="modal__precio"></p>
              <span id="modal-descuento" class="modal__descuento"></span>
            </div>

            <div class="modal__rating">
              <span id="modal-estrellas" class="material-icons">star</span>
              <span id="modal-puntuacion"></span>
              <span id="modal-votos" class="modal__votos"></span>
            </div>
            <p id="modal-desc" class="modal__descripcion"></p>

            <!-- Detalles Extra -->
            <div class="modal__extra-info">
              <p><strong>Stock:</strong> <span id="modal-stock"></span></p>
              <p><strong>SKU:</strong> <span id="modal-sku"></span></p>
              <p><strong>Peso:</strong> <span id="modal-peso"></span></p>
              <p>
                <strong>Dimensiones:</strong>
                <span id="modal-dimensiones"></span>
              </p>
              <p>
                <strong>Garantía:</strong> <span id="modal-garantia"></span>
              </p>
              <p><strong>Envío:</strong> <span id="modal-envio"></span></p>
              <p>
                <strong>Devolución:</strong> <span id="modal-devolucion"></span>
              </p>
            </div>
            <div class="modal__acciones">
              <button class="modal__boton-accion">Añadir al Carrito</button>
            </div>
          </div>
        </div>
      </div>
    </dialog>

    <!-- Toastify JS -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <script type="module" src="js/main_index.js"></script>
    <!-- EmailJS SDK -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"
    ></script>
    <script type="text/javascript">
      (function () {
        // Inicializar EmailJS con Public Key (PLACEHOLDER)
        emailjs.init("T8gNTMx4LYKUn-az0");
      })();
    </script>
  </body>
</html>
